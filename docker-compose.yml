services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: varia
      POSTGRES_PASSWORD: varia
      POSTGRES_DB: varia
    ports:
      - "5432:5432"
    volumes:
      - varia_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varia"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  varia_pg:
